name: 🏟️ Build & Package Extension

on:
  push:
    branches: [main]
    tags:     ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Extension
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔢 Get version
        id: version
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      - name: 📦 Package extension (.zip)
        run: |
          zip -r lorapok-worldcup26-v${{ steps.version.outputs.version }}.zip . \
            --exclude "*.DS_Store" --exclude "*/.git*"
          echo "✅ Packaged: lorapok-worldcup26-v${{ steps.version.outputs.version }}.zip"

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lorapok-worldcup26-v${{ steps.version.outputs.version }}
          path: lorapok-worldcup26-v${{ steps.version.outputs.version }}.zip
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔢 Get version
        id: version
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 📦 Re-package for release
        run: |
          zip -r lorapok-worldcup26-v${{ steps.version.outputs.version }}.zip . \
            --exclude "*.DS_Store"

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "⚽ Lorapok WorldCup 26 — v${{ steps.version.outputs.version }}"
          body: |
            ## ⚽ Lorapok WorldCup 26 v${{ steps.version.outputs.version }}

            FIFA World Cup 2026 dashboard — live scores, schedule, squads & ELO predictions.

            ### Install
            1. Download `lorapok-worldcup26-v${{ steps.version.outputs.version }}.zip`
            2. Open Firefox → `about:debugging` → This Firefox → Load Temporary Add-on
            3. Point to `manifest.json` inside the zip

            > **Firefox Add-ons store submission** is triggered automatically via the AMO workflow.

            ---
            *A [Lorapok Labs](https://lorapok.github.io) product · Building the Future. One Line at a Time.*
          files: lorapok-worldcup26-v${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: false
