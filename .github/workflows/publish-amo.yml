name: 🦊 Publish to Firefox Add-ons (AMO)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — lint only, no publish'
        type: boolean
        default: false

jobs:
  # ── Job 1: Lint ─────────────────────────────────────────────────
  lint:
    name: 🔍 Lint Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install web-ext
        run: npm install -g web-ext

      - name: Lint with web-ext
        run: web-ext lint --source-dir=. --ignore-files=.github docs README.md amo-listing.json scripts

      - name: Validate amo-listing.json
        run: |
          node -e "
          const l = JSON.parse(require('fs').readFileSync('amo-listing.json','utf8'));
          const required = ['guid','slug','name','summary','description','homepage',
                            'support_url','support_email','categories','version'];
          const missing = required.filter(k => !l[k]);
          if (missing.length) { console.error('Missing fields:', missing); process.exit(1); }
          const summaryLen = l.summary['en-US'].length;
          if (summaryLen > 250) { console.error('Summary too long:', summaryLen, '> 250'); process.exit(1); }
          console.log('✔ amo-listing.json valid — summary', summaryLen, 'chars');
          "

  # ── Job 2: Build & Package ──────────────────────────────────────
  build:
    name: 📦 Build Extension
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      version: ${{ steps.version.outputs.version }}
      xpi_name: ${{ steps.version.outputs.xpi_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Get version from manifest
        id: version
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          XPI_NAME="lorapok-worldcup26-v${VERSION}.zip"
          echo "version=$VERSION"  >> $GITHUB_OUTPUT
          echo "xpi_name=$XPI_NAME" >> $GITHUB_OUTPUT
          echo "📦 Building v$VERSION"

      - name: Package extension
        run: |
          mkdir -p artifacts
          zip -r artifacts/${{ steps.version.outputs.xpi_name }} . \
            --exclude "*.DS_Store" \
            --exclude "*/.git*"    \
            --exclude "*/scripts/*" \
            --exclude "*/docs/*"    \
            --exclude "*/.github/*" \
            --exclude "*/README.md" \
            --exclude "*/amo-listing.json"
          echo "✔ Packaged: artifacts/${{ steps.version.outputs.xpi_name }}"
          ls -lh artifacts/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-xpi-v${{ steps.version.outputs.version }}
          path: artifacts/${{ steps.version.outputs.xpi_name }}
          retention-days: 90

  # ── Job 3: Publish to AMO ───────────────────────────────────────
  publish:
    name: 🚀 Submit to AMO
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !inputs.dry_run }}

    env:
      AMO_API_KEY:    ${{ secrets.AMO_API_KEY }}
      AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
      XPI_PATH:       ${{ github.workspace }}/artifacts/${{ needs.build.outputs.xpi_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download XPI artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-xpi-v${{ needs.build.outputs.version }}
          path: artifacts/

      - name: Verify secrets are set
        run: |
          if [ -z "$AMO_API_KEY" ] || [ -z "$AMO_API_SECRET" ]; then
            echo "❌ AMO_API_KEY and AMO_API_SECRET must be set in repository secrets."
            echo "   Go to: Settings → Secrets and variables → Actions → New repository secret"
            echo ""
            echo "   Get your keys at:"
            echo "   https://addons.mozilla.org/en-US/developers/addon/api/key/"
            exit 1
          fi
          echo "✔ Secrets present (key: ${AMO_API_KEY:0:12}…)"

      - name: 🦊 Run AMO publish script
        run: node scripts/amo-publish.mjs

      - name: Summary
        if: success()
        run: |
          echo "## ✅ AMO Submission Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ needs.build.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Link | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Developer Hub | https://addons.mozilla.org/en-US/developers/addon/lorapok-worldcup26/ |" >> $GITHUB_STEP_SUMMARY
          echo "| Version Queue | https://addons.mozilla.org/en-US/developers/addon/lorapok-worldcup26/versions |" >> $GITHUB_STEP_SUMMARY
          echo "| Public Listing | https://addons.mozilla.org/en-US/firefox/addon/lorapok-worldcup26/ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Mozilla reviewers typically approve listed extensions within 1–7 days. Watch your registered AMO email." >> $GITHUB_STEP_SUMMARY

  # ── Job 4: GitHub Release ────────────────────────────────────────
  release:
    name: 📋 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, publish]
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download XPI artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-xpi-v${{ needs.build.outputs.version }}
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "⚽ Lorapok WorldCup 26 — v${{ needs.build.outputs.version }}"
          body: |
            ## ⚽ Lorapok WorldCup 26 v${{ needs.build.outputs.version }}

            FIFA World Cup 2026 dashboard — live scores, schedule, squads & ELO predictions.

            ### 🦊 Firefox Add-ons Store
            👉 **[Install from AMO](https://addons.mozilla.org/en-US/firefox/addon/lorapok-worldcup26/)** *(pending review)*

            ### ⬇️ Manual Install (Developer Mode)
            1. Download `${{ needs.build.outputs.xpi_name }}` below
            2. Open Firefox → `about:debugging` → **This Firefox** → **Load Temporary Add-on**
            3. Select the downloaded `.zip`

            ---
            *A [Lorapok Labs](https://lorapok.github.io) product · [Source Code](https://github.com/lorapok/worldcup26) · MIT License*
          files: artifacts/${{ needs.build.outputs.xpi_name }}
          draft: false
          prerelease: false
